name: CI/CD - Docker Build & Deploy

on:
  push:
    branches:
      - QA

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del código
      - name: Checkout code
        uses: actions/checkout@v2

      # Paso 2: Login en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Paso 3: Construir y subir imágenes de book_management
      - name: Build and Push Book Management Microservices
        run: |
          for service in register update list remove; do
            echo "Building and pushing microservice_${service}_book..."
            docker build -f book_management/Microservice_${service}_book/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_book:latest book_management/Microservice_${service}_book
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_book:latest
          done

      # Paso 4: Construir y subir imágenes de book_catalog
      - name: Build and Push Book Catalog Microservices
        run: |
          for service in registre update list delete; do
            echo "Building and pushing microservice_${service}_catalog..."
            docker build -f book_catalog/Microservice_${service}_catalog/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_catalog:latest book_catalog/Microservice_${service}_catalog
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_catalog:latest
          done



  deploy-book-management:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 Book Management and deploy containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_BOOK_IP }}
          username: ubuntu
          key: ${{ secrets.BOOK_KEY }}
          script: |
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi
            sudo systemctl enable --now docker

            echo "Descargando imágenes..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_register_book:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_update_book:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_list_book:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_remove_book:latest

            sudo docker stop microservice_register_book || true && sudo docker rm microservice_register_book || true
            sudo docker stop microservice_update_book || true && sudo docker rm microservice_update_book || true
            sudo docker stop microservice_list_book || true && sudo docker rm microservice_list_book || true
            sudo docker stop microservice_remove_book || true && sudo docker rm microservice_remove_book || true

            mkdir -p src
            echo "REACT_APP_RDS_HOST=${{ secrets.REACT_APP_RDS_HOST }}" > src/.env
            echo "REACT_APP_RDS_PORT=${{ secrets.REACT_APP_RDS_PORT }}" >> src/.env
            echo "REACT_APP_RDS_DATABASE=${{ secrets.REACT_APP_RDS_DATABASE }}" >> src/.env
            echo "REACT_APP_RDS_USER=${{ secrets.REACT_APP_RDS_USER }}" >> src/.env
            echo "REACT_APP_RDS_PASSWORD=${{ secrets.REACT_APP_RDS_PASSWORD }}" >> src/.env

            cat src/.env

            echo "Ejecutando microservicios book_management..."
            sudo docker run -d --name microservice_register_book --env-file src/.env -p 4000:4000 ${{ secrets.DOCKER_USERNAME }}/microservice_register_book:latest
            sudo docker run -d --name microservice_update_book --env-file src/.env -p 4003:4003 ${{ secrets.DOCKER_USERNAME }}/microservice_update_book:latest
            sudo docker run -d --name microservice_list_book --env-file src/.env -p 4001:4001 ${{ secrets.DOCKER_USERNAME }}/microservice_list_book:latest
            sudo docker run -d --name microservice_remove_book --env-file src/.env -p 4002:4002 ${{ secrets.DOCKER_USERNAME }}/microservice_remove_book:latest

            sudo docker ps -a
            echo "Deployment of book_management completed."


  deploy-book-catalog:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 Book Catalog and deploy containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_CATALOG_IP }}
          username: ubuntu
          key: ${{ secrets.CATALOG_KEY }}
          script: |
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi
            sudo systemctl enable --now docker

            echo "Descargando imágenes..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_registre_catalog:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_update_catalog:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_list_catalog:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_delete_catalog:latest

            sudo docker stop microservice_registre_catalog || true && sudo docker rm microservice_registre_catalog || true
            sudo docker stop microservice_update_catalog || true && sudo docker rm microservice_update_catalog || true
            sudo docker stop microservice_list_catalog || true && sudo docker rm microservice_list_catalog || true
            sudo docker stop microservice_delete_catalog || true && sudo docker rm microservice_delete_catalog || true

            mkdir -p src
            echo "REACT_APP_RDS_HOST=${{ secrets.REACT_APP_RDS_HOST }}" > src/.env
            echo "REACT_APP_RDS_PORT=${{ secrets.REACT_APP_RDS_PORT }}" >> src/.env
            echo "REACT_APP_RDS_DATABASE=${{ secrets.REACT_APP_RDS_DATABASE }}" >> src/.env
            echo "REACT_APP_RDS_USER=${{ secrets.REACT_APP_RDS_USER }}" >> src/.env
            echo "REACT_APP_RDS_PASSWORD=${{ secrets.REACT_APP_RDS_PASSWORD }}" >> src/.env

            cat src/.env

            echo "Ejecutando microservicios book_catalog..."
            sudo docker run -d --name microservice_registre_catalog --env-file src/.env -p 3001:3001 ${{ secrets.DOCKER_USERNAME }}/microservice_registre_catalog:latest
            sudo docker run -d --name microservice_update_catalog --env-file src/.env -p 3003:3003 ${{ secrets.DOCKER_USERNAME }}/microservice_update_catalog:latest
            sudo docker run -d --name microservice_list_catalog --env-file src/.env -p 3002:3002 ${{ secrets.DOCKER_USERNAME }}/microservice_list_catalog:latest
            sudo docker run -d --name microservice_delete_catalog --env-file src/.env -p 3004:3004 ${{ secrets.DOCKER_USERNAME }}/microservice_delete_catalog:latest

            sudo docker ps -a
            echo "Deployment of book_catalog completed."
