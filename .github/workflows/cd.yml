name: CI/CD - Docker Build & Deploy

on:
  push:
    branches:
      - QA  # O la rama que estés utilizando

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del código
      - name: Checkout code
        uses: actions/checkout@v2

      # Paso 2: Login en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Paso 4: Construir y subir las imágenes Docker de los microservicios
      - name: Build and Push Book Management Microservices
        run: |
          for service in create update list remove; do
            echo "Building and pushing microservice_${service}_book..."
            docker build -f book_management/Microservice_${service}_book/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_book:latest book_management/Microservice_${service}_book
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_book:latest
          done
        
