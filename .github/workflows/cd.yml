  deploy-boo-management:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy Docker containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_BOOK_IP}}
          username: ubuntu
          key: ${{ secrets.BOOK_KEY }}
          script: |
            # Verificar si Docker está instalado, si no, instalarlo
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi

            # Hacer que Docker se inicie automáticamente
            sudo systemctl enable --now docker

            # Descargar las últimas imágenes desde Docker Hub
            echo "Descargando imágenes..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_register_book:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_update_book:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_list_book:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_remove_book:latest
            
            # Verificar si las imágenes fueron descargadas correctamente
            sudo docker images

            # Detener y eliminar los contenedores existentes por nombre
            sudo docker stop microservice_register_dog || true
            sudo docker rm microservice_register_dog || true
            sudo docker stop microservice_updateBook || true
            sudo docker rm microservice_updateBook || true
            sudo docker stop microservice_list_book || true
            sudo docker rm microservice_list_book|| true
            sudo docker stop microservice_remove_book || true
            sudo docker rm microservice_remove_book || true

            # Verificar las variables de entorno antes de generar el archivo
            echo "Base de datos: $REACT_APP_RDS_HOST"

            # Crear el archivo .env dentro de la carpeta src
            mkdir -p src
            echo "REACT_APP_RDS_HOST=${{ secrets.REACT_APP_RDS_HOST }}" >> src/.env
            echo "REACT_APP_RDS_PORT=${{ secrets.REACT_APP_RDS_PORT }}" >> src/.env
            echo "REACT_APP_RDS_DATABASE=${{ secrets.REACT_APP_RDS_DATABASE }}" >> src/.env
            echo "REACT_APP_RDS_USER=${{ secrets.REACT_APP_RDS_USER }}" >> src/.env
            echo "REACT_APP_RDS_PASSWORD=${{ secrets.REACT_APP_RDS_PASSWORD }}" >> src/.env

            # Verificar que el archivo .env se ha creado correctamente
            cat src/.env

            # Ejecutar los contenedores Docker con el archivo .env dentro de src
            echo "Ejecutando microservice_create_dog..."
            sudo docker run -d --name microservice_register_dog --env-file src/.env -p 4000:4000 ${{ secrets.DOCKER_USERNAME }}/microservice_register_dog:latest
            echo "Ejecutando microservice_updateBook..."
            sudo docker run -d --name microservice_updateBook --env-file src/.env -p 4003:4003 ${{ secrets.DOCKER_USERNAME }}/microservice_updateBook:latest
            echo "Ejecutando microservice_list_book..."
            sudo docker run -d --name microservice_list_book --env-file src/.env -p 4001:4001 ${{ secrets.DOCKER_USERNAME }}/microservice_list_book:latest
            echo "Ejecutando microservice_remove_book..."
            sudo docker run -d --name microservice_remove_book --env-file src/.env -p 4002:4002 ${{ secrets.DOCKER_USERNAME }}/microservice_remove_book:latest

            # Verificar que los contenedores están corriendo
            sudo docker ps -a